run_id: qwenact
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFTLeWorldSim
  pretrained_checkpoint: /H20_vepfs/liulin/starVLA/VLA_models/Qwen3VL-OFT-Bridge-RT-1/checkpoints/steps_5000_pytorch_model.pt
  freeze_qwenfast: False #True
  action_model:
    action_dim: 7
    state_dim: 7
    future_action_window_size: 15
    action_horizon: 16
  # LeWorldModel configuration
  leworld_model:
    # Enable/disable LeWorldModel integration
    enable: true

    # Vision encoder configuration
    encoder_scale: "tiny"  # Options: tiny, small, base, large
    patch_size: 14
    img_size: 224

    # World model temporal configuration
    history_size: 16  # Number of history frames for prediction
    num_preds: 1     # Number of future frames to predict

    # Embedding dimensions
    embed_dim: 768
    action_dim: 7
    frameskip: 5

    # Predictor architecture
    predictor:
      depth: 4
      heads: 8
      mlp_dim: 2048
      dim_head: 64
      dropout: 0.0
      emb_dropout: 0.0

    # Loss weights for joint training
    loss_weights:
      action_loss: 1.0        # Weight for action head L1 loss
      world_model_loss: 0.1   # Weight for world model prediction loss
      sigreg_loss: 0.01       # Weight for SIGReg regularization loss

    # SIGReg regularizer configuration
    sigreg:
      knots: 17
      num_proj: 1024

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets/OXE_LEROBOT_DATASET
    data_mix: bridge_rt_1 # bridge_rt_1
    action_type: delta_ee
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    
trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  # pretrained_checkpoint: ./results/Checkpoints/1_need/0601_qwenact_fixqwen_32gpus_lr_1e-3_qformer_36_37/steps_100000/pytorch_model.pt
  # reload_modules: 'action_model,layer_qformer' # warning: this may cause model to not converge
  # repeated_diffusion_steps moved to framework.action_model.repeated_diffusion_steps
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
