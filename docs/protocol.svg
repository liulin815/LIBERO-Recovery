<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="'Noto Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="600" fill="#1d1d1f">Per-scene protocol</text>
  <text x="40" y="68" font-size="13" fill="#6e6e73">10 seeded rollouts per scene · a fresh ±2 cm xy perturbation per rollout · half start closed-grip, half open-grip</text>

  <!-- Scene card -->
  <rect x="40" y="98" width="360" height="58" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
  <rect x="40" y="98" width="4" height="58" rx="2" fill="#0071e3"/>
  <text x="220" y="122" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">One scene = &lt;stem&gt;.bddl + &lt;stem&gt;_sim_state.npy</text>
  <text x="220" y="142" font-size="11.5" fill="#6e6e73" text-anchor="middle">task from (:language …) · disk files never modified</text>

  <!-- rollouts chips -->
  <text x="440" y="112" font-size="12" fill="#6e6e73">trials: 5 close (gripper shut) + 5 open</text>
  <g font-size="11" text-anchor="middle">
    <rect x="440" y="122" width="42" height="26" rx="13" fill="#0071e3"/><text x="461" y="139" fill="#ffffff">close</text>
    <rect x="490" y="122" width="42" height="26" rx="13" fill="#0071e3"/><text x="511" y="139" fill="#ffffff">close</text>
    <rect x="540" y="122" width="42" height="26" rx="13" fill="#0071e3"/><text x="561" y="139" fill="#ffffff">close</text>
    <rect x="590" y="122" width="42" height="26" rx="13" fill="#0071e3"/><text x="611" y="139" fill="#ffffff">close</text>
    <rect x="640" y="122" width="42" height="26" rx="13" fill="#0071e3"/><text x="661" y="139" fill="#ffffff">close</text>
    <rect x="690" y="122" width="42" height="26" rx="13" fill="#ffffff" stroke="#0071e3"/><text x="711" y="139" fill="#0071e3">open</text>
    <rect x="740" y="122" width="42" height="26" rx="13" fill="#ffffff" stroke="#0071e3"/><text x="761" y="139" fill="#0071e3">open</text>
    <rect x="790" y="122" width="42" height="26" rx="13" fill="#ffffff" stroke="#0071e3"/><text x="811" y="139" fill="#0071e3">open</text>
    <rect x="840" y="122" width="42" height="26" rx="13" fill="#ffffff" stroke="#0071e3"/><text x="861" y="139" fill="#0071e3">open</text>
    <rect x="890" y="122" width="42" height="26" rx="13" fill="#ffffff" stroke="#0071e3"/><text x="911" y="139" fill="#0071e3">open</text>
  </g>

  <!-- Pipeline steps -->
  <g>
    <rect x="40" y="204" width="140" height="88" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="56" y="228" font-size="11" font-weight="600" fill="#0071e3">1 · LOAD</text>
    <text x="56" y="250" font-size="12" font-weight="600" fill="#1d1d1f">Build env</text>
    <text x="56" y="268" font-size="11" fill="#6e6e73">from .bddl; load</text>
    <text x="56" y="283" fill="#6e6e73" font-size="11">sim_state.npy</text>

    <line x1="180" y1="248" x2="204" y2="248" stroke="#6e6e73" stroke-width="1.5"/>
    <path d="M204 248 l-9 -5 v10 z" fill="#6e6e73"/>

    <rect x="204" y="204" width="140" height="88" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="220" y="228" font-size="11" font-weight="600" fill="#0071e3">2 · PERTURB</text>
    <text x="220" y="250" font-size="12" font-weight="600" fill="#1d1d1f">Randomize objects</text>
    <text x="220" y="268" font-size="11" fill="#6e6e73">uniform ±2 cm xy</text>
    <text x="220" y="283" fill="#6e6e73" font-size="11">free-joint bodies</text>

    <line x1="344" y1="248" x2="368" y2="248" stroke="#6e6e73" stroke-width="1.5"/>
    <path d="M368 248 l-9 -5 v10 z" fill="#6e6e73"/>

    <rect x="368" y="204" width="140" height="88" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="384" y="228" font-size="11" font-weight="600" fill="#0071e3">3 · RESTORE</text>
    <text x="384" y="250" font-size="12" font-weight="600" fill="#1d1d1f">Set init state</text>
    <text x="384" y="268" font-size="11" fill="#6e6e73">in-memory copy;</text>
    <text x="384" y="283" fill="#6e6e73" font-size="11">reset OSC goal</text>

    <line x1="508" y1="248" x2="532" y2="248" stroke="#6e6e73" stroke-width="1.5"/>
    <path d="M532 248 l-9 -5 v10 z" fill="#6e6e73"/>

    <rect x="532" y="204" width="140" height="88" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="548" y="228" font-size="11" font-weight="600" fill="#0071e3">4 · SETTLE GRIP</text>
    <text x="548" y="250" font-size="12" font-weight="600" fill="#1d1d1f">Drive gripper</text>
    <text x="548" y="268" font-size="11" fill="#6e6e73">20 steps drive to</text>
    <text x="548" y="283" fill="#6e6e73" font-size="11">close / open state</text>

    <line x1="672" y1="248" x2="696" y2="248" stroke="#6e6e73" stroke-width="1.5"/>
    <path d="M696 248 l-9 -5 v10 z" fill="#6e6e73"/>

    <rect x="696" y="204" width="140" height="88" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="712" y="228" font-size="11" font-weight="600" fill="#0071e3">5 · ROLL OUT</text>
    <text x="712" y="250" font-size="12" font-weight="600" fill="#1d1d1f">Policy control</text>
    <text x="712" y="268" font-size="11" fill="#6e6e73">≤ 520 steps;</text>
    <text x="712" y="283" fill="#6e6e73" font-size="11">success = env done</text>

    <line x1="836" y1="248" x2="860" y2="248" stroke="#6e6e73" stroke-width="1.5"/>
    <path d="M860 248 l-9 -5 v10 z" fill="#6e6e73"/>

    <rect x="860" y="204" width="112" height="88" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="876" y="228" font-size="11" font-weight="600" fill="#0071e3">6 · RECORD</text>
    <text x="876" y="250" font-size="12" font-weight="600" fill="#1d1d1f">Save rollout</text>
    <text x="876" y="268" font-size="11" fill="#6e6e73">videos + npz</text>
    <text x="876" y="283" fill="#6e6e73" font-size="11">+ timing metrics</text>
  </g>

  <!-- Metrics -->
  <rect x="40" y="322" width="920" height="56" rx="10" fill="#f5f5f7"/>
  <text x="60" y="346" font-size="12" font-weight="600" fill="#1d1d1f">Metrics per rollout</text>
  <g font-size="11" fill="#0071e3" text-anchor="middle">
    <rect x="60"  y="354" width="170" height="18" rx="9" fill="#ffffff"/><text x="145" y="367">success · close/open rates</text>
    <rect x="245" y="354" width="215" height="18" rx="9" fill="#ffffff"/><text x="352" y="367">first_contact_step (force Δ &gt; 2.0)</text>
    <rect x="475" y="354" width="165" height="18" rx="9" fill="#ffffff"/><text x="557" y="367">first_gripper_change_step</text>
    <rect x="655" y="354" width="240" height="18" rx="9" fill="#ffffff"/><text x="775" y="367">seeded RNGs — reproducible with --seed</text>
  </g>
</svg>
